# Minimal bot configuration. The loader supports simple key: value pairs.
default_market: US
broker: mock
data_dir: data
approval_queue: pending_orders.json
max_positions: 5
risk_per_trade_pct: 1.0
min_score: 24
min_rr: 1.5
# ── Risk guards ──
max_position_pct: 20.0      # cap one position at this % of account value (0 = off)
daily_loss_limit_pct: 3.0   # halt new buys after today's realized loss hits this % (0 = off)
stale_order_minutes: 60     # cancel unfilled limit orders older than this (0 = off)
# ── Entry style ──
require_breakout: false     # true = only buy fresh pivot breaks on 1.4x volume (Minervini strict)
